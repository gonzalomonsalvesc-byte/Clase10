            <style>
			body{
			font-family:"Space Grotesk", sans-serif;
			

                /* Fondo y marco */
                .bg {
                    fill: #fff;
                }
                .frame {
                    fill: none;
                    stroke: #ccc;
                }

                /* Cuadrícula y ejes */
                .grid {
                    fill: none;
                    stroke: lightgray;
                }
                .axis {
                    stroke: #000;
                }
                .axis-label {
                    font-size: 12px;
                    text-anchor: middle;
                }

                /* Eje Y (escala 0-90) */
                .y-axis line {
                    stroke: #000;
                }
                .y-axis text {
                    font-size: 10px;
                    text-anchor: end;
                }

                /* Series: cada una define su color en --c */
                .s0 {
                    --c: #f8e71c;
                }
                .s1 {
                    --c: #4a90e2;
                }
                .s2 {
                    --c: #7ed321;
                }
                .s3 {
                    --c: #d62728;
                }

                .serie polygon {
                    fill: var(--c);
                    fill-opacity: 0.2;
                    stroke: var(--c);
                }
                .serie circle {
                    fill: var(--c);
                    stroke: none;
                }

                /* Leyenda */
                .legend-title {
                    font-size: 12px;
                    font-weight: bold;
                }
                .swatch {
                    width: 15px;
                    height: 15px;
                    fill: var(--c);
                }
                .legend text {
                    font-size: 10px;
                }
            </style>
